# Publishes the site to GitHub Pages. It only runs when I start it by hand:
# Actions, "Deploy to Pages", Run workflow.
#
# By default it publishes the open site, the same build as `npm run build`. Tick "locked" to publish
# the password copy instead; that needs the repository secret LONG_SUNDAY_PASSWORD, and without it
# the build fails and nothing is deployed.
#
# Without a custom domain the site shares <user>.github.io with every other Pages site on the
# account, and so its browser storage too. docs/DEV.md, "Stay unlocked", says what that means.
name: Deploy to Pages

on:
  workflow_dispatch:
    inputs:
      locked:
        description: Publish the password copy instead of the open site
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the open site
        if: ${{ !inputs.locked }}
        run: |
          npm run build
          mkdir -p site && cp -R dist/. site/

      - name: Build the locked copy
        if: ${{ inputs.locked }}
        env:
          LONG_SUNDAY_PASSWORD: ${{ secrets.LONG_SUNDAY_PASSWORD }}
        run: npm run build:locked

      # A second look before a locked copy leaves: the page must be the lock, with no application in the clear.
      - name: Check that the page is locked
        if: ${{ inputs.locked }}
        run: |
          test -s dist-locked/index.html
          grep -q 'id="ls-box"' dist-locked/index.html
          if grep -q -e '<canvas' -e 'type="module"' dist-locked/index.html; then
            echo "The page holds application markup in the clear."
            exit 1
          fi
          mkdir -p site && cp -R dist-locked/. site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
