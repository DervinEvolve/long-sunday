<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ecdfc6" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Long Sunday</title>
    <meta name="description" content="Long Sunday, by Dervin Dimanche. By invitation." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a9b0ee'/%3E%3Cpath d='M0 24h32v1a7 7 0 0 1-7 7H7a7 7 0 0 1-7-7z' fill='%238cc56c'/%3E%3Cg stroke='%231c1a33' stroke-width='1.3' stroke-linejoin='round'%3E%3Ccircle cx='21.6' cy='7.2' r='3.9' fill='%23f3c531'/%3E%3Cpath d='M21.9 21h2.6v5.2h-2.6z' fill='%23c8684e'/%3E%3Ccircle cx='23.2' cy='18.4' r='4.7' fill='%234f9c62'/%3E%3Cpath d='M7 11.5h6V24H7z' fill='%23f5f0e8'/%3E%3Cpath d='M5.2 8.5h9.6v3H5.2zM5.2 23.6h9.6v3H5.2z' fill='%23f5f0e8'/%3E%3C/g%3E%3Cpath d='M9 12.7v9.9M11 12.7v9.9' stroke='%23d6cde4' stroke-width='1'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./lock.css" />
  </head>
  <body>
    <main class="card">
      <p class="owner">Dervin Dimanche</p>
      <h1 class="name">Long Sunday</h1>
      <noscript><p class="what">This page needs JavaScript to open.</p></noscript>
      <form id="ls-form" class="form" hidden>
        <p class="what" id="ls-what">This one is by invitation. Enter the password to walk in.</p>
        <div class="field">
          <label class="label" for="ls-pass">Password</label>
          <div class="row">
            <input class="input" id="ls-pass" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required aria-describedby="ls-what ls-error" />
            <button class="btn btn--show" id="ls-show" type="button">Show<span class="sr"> password</span></button>
          </div>
          <p class="error" id="ls-error" role="alert"></p>
        </div>
        <label class="keep"><input class="check" id="ls-keep" type="checkbox" /><span>Stay unlocked on this device</span></label>
        <button class="btn btn--primary" id="ls-go" type="submit">Open</button>
      </form>
      <p class="status" id="ls-status" role="status"></p>
    </main>
    <script type="application/json" id="ls-box">{}</script>
    <script src="./lock.js"></script>
  </body>
</html>
